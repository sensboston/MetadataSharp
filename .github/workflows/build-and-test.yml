name: Build and test

on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [master]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Two tiers. A push to a work branch builds and tests two legs in parallel (ubuntu, net8.0 and
    # net10.0) for a fast answer; a pull request and master get the full matrix before anything is
    # merged. Both target frameworks are in the fast tier because a failure can belong to one runtime:
    # ExifEdit.Set of a long text failed on net8.0 only (PR #110) and showed in the pull request run.
    name: ${{ matrix.tfm }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && github.ref != 'refs/heads/master' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
        tfm: ['net8.0', 'net10.0']
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      # SDK 10 builds every target; the .NET 8 SDK (and its runtime) is installed only where net8.0
      # code runs. Downloading SDKs was the slowest step of the Windows legs.
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install .NET 8 SDK
        if: matrix.tfm == 'net8.0'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Record SDK and runtime environment
        run: dotnet --info
      - name: Restore
        run: dotnet restore MetadataSharp.sln
      - name: Inventory Core documentation (baseline)
        run: dotnet run --project tools/MetadataSharp.DocInventory --configuration Release -- --root src/MetadataSharp.Core --check-public --report artifacts/doc-inventory/baseline-core.json
      - name: Report Core documentation inventory
        run: python tools/MetadataSharp.DocInventory/report.py core artifacts/doc-inventory/baseline-core.json
      - name: Inventory Formats documentation (baseline)
        run: dotnet run --project tools/MetadataSharp.DocInventory --configuration Release -- --root src/MetadataSharp.Formats --check-public --report artifacts/doc-inventory/baseline-formats.json
      - name: Report Formats documentation inventory
        run: python tools/MetadataSharp.DocInventory/report.py formats artifacts/doc-inventory/baseline-formats.json
      - name: Inventory tools documentation (baseline)
        run: dotnet run --project tools/MetadataSharp.DocInventory --configuration Release -- --root tools --report artifacts/doc-inventory/baseline-tools.json
      - name: Report tools documentation inventory
        run: python tools/MetadataSharp.DocInventory/report.py tools artifacts/doc-inventory/baseline-tools.json
      - name: Inventory samples documentation (baseline)
        run: dotnet run --project tools/MetadataSharp.DocInventory --configuration Release -- --root samples --report artifacts/doc-inventory/baseline-samples.json
      - name: Report samples documentation inventory
        run: python tools/MetadataSharp.DocInventory/report.py samples artifacts/doc-inventory/baseline-samples.json
      - name: Build Release
        run: dotnet build MetadataSharp.sln --configuration Release --no-restore
      - name: Verify authored video fixtures
        run: python tools/reference/video_fixtures.py verify tests/fixtures/video
      - name: Test offline reference-harness policy
        shell: bash
        run: python -m unittest discover -s tests/reference -v 2>&1 | tee reference.log
      - name: Test offline supporting parity reports
        shell: bash
        run: python -m unittest discover -s tests/parity -v 2>&1 | tee parity.log
      # Python-suite detail is published the same way the .NET trx failures below are. The
      # Actions log host is not readable from every environment that recovers this repo's
      # evidence, and a red leg that reports only "exit code 1" costs a whole round trip:
      # a Windows-only line-ending failure in the B10 evidence digests sat behind exactly that
      # for two pushes. unittest writes failures to stderr, so the steps above tee their merged
      # output to a file and this step turns the failing names into annotations.
      - name: Report failed Python policy details
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          found = False
          for log in (Path('reference.log'), Path('parity.log')):
              if not log.exists():
                  continue
              lines = log.read_text(encoding='utf-8', errors='replace').splitlines()
              # A traceback's first line names nothing; the reason is two or three lines further down.
              wanted = set()
              for index, line in enumerate(lines):
                  if line.startswith(('FAIL:', 'ERROR:', 'AssertionError', 'Traceback', 'FAILED', 'Ran ')):
                      wanted.update(range(index, min(index + 5, len(lines))))
              picked = [lines[index] for index in sorted(wanted)][:24]
              for line in picked or lines[-12:]:
                  text = line[:2000].replace('%', '%25').replace('\r', '%0D')
                  print('::error title=Python policy failure (' + log.name + ')::' + text)
                  found = True
          if not found:
              print('::error title=Python policy failure::no suite log: a step failed before '
                    'writing one (check the --check scripts and the step order)')
      - name: Test Release
        run: dotnet test tests/MetadataSharp.Tests/MetadataSharp.Tests.csproj --framework ${{ matrix.tfm }} --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults/${{ matrix.tfm }}
      # The README's "Quick start" as code: every snippet is run, and the README has to show them as compiled.
      - name: Test README examples
        run: dotnet test tests/MetadataSharp.Examples/MetadataSharp.Examples.csproj --framework ${{ matrix.tfm }} --configuration Release --no-build --no-restore --logger "trx;LogFileName=examples.trx" --results-directory TestResults/${{ matrix.tfm }}
      - name: Report failed test details
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          for path in Path('TestResults').rglob('*.trx'):
              for result in ET.parse(path).getroot().findall('.//t:UnitTestResult', ns):
                  if result.get('outcome') == 'Failed':
                      text = result.get('testName', '') + ': ' + ' '.join(result.itertext())
                      text = text[:6000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Unit test failure::' + text)
      - name: Verify tests actually ran
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('TestResults').rglob('*.trx'))
          if not files:
              raise SystemExit('No TRX results found')
          total = 0
          for file in files:
              root = ET.parse(file).getroot()
              ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
              counters = root.find('t:ResultSummary/t:Counters', ns)
              if counters is None:
                  raise SystemExit(f'No test counters in {file}')
              count = int(counters.attrib['total'])
              passed = int(counters.attrib['passed'])
              if count != passed:
                  raise SystemExit(f'Not all tests passed in {file}: {counters.attrib}')
              total += count
          if total < 450:
              raise SystemExit(f'Expected at least 450 M01–M16 cases, got {total}')
          print(f'::notice title=Executed test count::Validated {total} passing tests')
      - name: Upload documentation inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-inventory-${{ matrix.os }}-${{ matrix.tfm }}
          path: artifacts/doc-inventory/baseline-*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.tfm }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7

  samples:
    name: Samples / net10.0 / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build every sample (the desktop viewer is build-only)
        shell: bash
        run: |
          set -euo pipefail
          for project in MetaTool GeoTag BatchRename StripMetadata CopyMetadata Thumbnails MetadataViewer; do
            log="$(mktemp)"
            if ! dotnet build "samples/$project/$project.csproj" --configuration Release >"$log" 2>&1; then
              cat "$log"
              PROJECT="$project" LOG="$log" python - <<'PY'
          import os
          from pathlib import Path
          project = os.environ['PROJECT']
          lines = Path(os.environ['LOG']).read_text(errors='replace').splitlines()
          print(f"::error title={project} build failed::" + " | ".join(lines[-15:]))
          PY
              exit 1
            fi
            cat "$log"
            rm "$log"
          done
      - name: Generate small authored image fixtures
        shell: bash
        run: |
          mkdir -p artifacts/samples
          dotnet run --project tools/MetadataSharp.ReferenceFixture --configuration Release --framework net10.0 -- generate artifacts/samples
          cp artifacts/samples/ours.jpg artifacts/samples/camera.jpg
          cp artifacts/samples/base.jpg artifacts/samples/target.jpg
          cat > artifacts/samples/track.gpx <<'GPX'
          <?xml version="1.0"?>
          <gpx version="1.1" creator="MetadataSharp sample"><trk><trkseg>
            <trkpt lat="51.5007" lon="-0.1246"><time>2024-01-01T10:00:00Z</time></trkpt>
          </trkseg></trk></gpx>
          GPX
      - name: Smoke-test the command-line samples on public API fixtures
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project samples/MetaTool -c Release --no-build -- -p a artifacts/samples/camera.jpg
          dotnet run --project samples/MetaTool -c Release --no-build -- set Exif.Photo.DateTimeOriginal '2024:01:01 10:00:00' artifacts/samples/camera.jpg
          dotnet run --project samples/MetaTool -c Release --no-build -- -M 'set Exif.Image.Artist "Sample Author"' artifacts/samples/camera.jpg
          dotnet run --project samples/MetaTool -c Release --no-build -- -p e -K Exif.Image.Artist artifacts/samples/camera.jpg | grep -F 'Sample Author'
          dotnet run --project samples/MetaTool -c Release --no-build -- extract xmp artifacts/samples/xmp.jpg artifacts/samples/out.xmp
          cp artifacts/samples/target.jpg artifacts/samples/copy.jpg
          dotnet run --project samples/MetaTool -c Release --no-build -- insert xmp artifacts/samples/copy.jpg artifacts/samples/xmp-rich.xmp
          dotnet run --project samples/MetaTool -c Release --no-build -- insert thumbnail artifacts/samples/copy.jpg artifacts/samples/base.jpg
          dotnet run --project samples/MetaTool -c Release --no-build -- fixiso artifacts/samples/camera.jpg
          dotnet run --project samples/MetaTool -c Release --no-build -- fixcom artifacts/samples/camera.jpg
          dotnet run --project samples/GeoTag -c Release --no-build -- --gpx artifacts/samples/track.gpx --max-gap 2m artifacts/samples/camera.jpg
          dotnet run --project samples/BatchRename -c Release --no-build -- --dry-run artifacts/samples/camera.jpg
          dotnet run --project samples/StripMetadata -c Release --no-build -- --keep icc,orientation,copyright --dry-run artifacts/samples/camera.jpg
          dotnet run --project samples/CopyMetadata -c Release --no-build -- --dry-run artifacts/samples/camera.jpg artifacts/samples/target.jpg
          dotnet run --project samples/Thumbnails -c Release --no-build -- list artifacts/samples/copy.jpg
          dotnet run --project samples/Thumbnails -c Release --no-build -- extract artifacts/samples/copy.jpg artifacts/samples/previews

  external-reference:
    # Depends on Ubuntu's package mirror (exiv2 0.27.6, exiftool, webp from apt), which has failed for
    # hours at a time on the runners. Runs nightly and on demand; parity against the pinned 0.28.9
    # binary is the per-commit gate.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    name: References / ${{ matrix.tfm }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0, net10.0]
    timeout-minutes: 15
    env:
      LC_ALL: C
      METADATASHARP_REFERENCE_TFM: ${{ matrix.tfm }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      # SDK 10 builds every target; the .NET 8 SDK (and its runtime) is installed only where net8.0
      # code runs. Downloading SDKs was the slowest step of the Windows legs.
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install .NET 8 SDK
        if: matrix.tfm == 'net8.0'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install external CLI tools
        timeout-minutes: 5
        run: |
          # Runner mirrors occasionally fail DNS; fail fast and retry instead of hanging for minutes.
          APT_OPTS='-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20'
          for attempt in 1 2 3; do
            sudo apt-get $APT_OPTS update &&
              sudo apt-get $APT_OPTS install -y exiv2 libimage-exiftool-perl webp && break
            [ "$attempt" = 3 ] && exit 1
            # The runner's Azure mirror has failed DNS for hours at a time; fall back to the main archive.
            echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources || true
            sleep 10
          done
          mkdir -p artifacts/reference
          dpkg-query -W exiv2 libimage-exiftool-perl webp > artifacts/reference/packages.txt
          cp /usr/share/doc/exiv2/copyright artifacts/reference/exiv2-copyright.txt
          cp /usr/share/doc/libimage-exiftool-perl/copyright artifacts/reference/exiftool-copyright.txt
          cp /usr/share/doc/webp/copyright artifacts/reference/webp-copyright.txt
          dotnet --info > artifacts/reference/dotnet-info.txt
      - name: Build fixture generator and public API consumer
        run: dotnet build MetadataSharp.sln --configuration Release
      - name: Required differential and validation checks
        run: python tools/reference/harness.py --required
      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-reference-evidence-${{ matrix.tfm }}
          path: artifacts/reference/
          if-no-files-found: warn
          retention-days: 7

  performance-package-audit:
    # Package audit: on pull requests and master only.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    name: Audit / ${{ matrix.os }} / ${{ matrix.tfm }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        # Package contents and the dependency audit do not depend on the OS; one runner is enough.
        os: [ubuntu-latest]
        tfm: [net8.0, net10.0]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      AUDIT_TFM: ${{ matrix.tfm }}
      AUDIT_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      # SDK 10 builds every target; the .NET 8 SDK (and its runtime) is installed only where net8.0
      # code runs. Downloading SDKs was the slowest step of the Windows legs.
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install .NET 8 SDK
        if: matrix.tfm == 'net8.0'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Record SDK and environment
        run: dotnet --info
      - name: Measure and audit local candidates
        run: python tools/audit/run.py
      - name: Upload audit evidence (never publish packages)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.os }}-${{ matrix.tfm }}
          path: |
            artifacts/audit/**/baseline.json
            artifacts/audit/**/packages.json
          if-no-files-found: error
          retention-days: 30

  differential-parity:
    # Branches of this repository are built by their push run, which GitHub also shows on the PR;
    # pull_request runs only for forks, so each commit is built once.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Exiv2 0.28.9 / differential parity
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LC_ALL: C
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DUMP: dotnet run --project tools/MetadataSharp.Dump -c Release -f net10.0 --no-build --
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the dump tool (restricted to the public API by construction)
        run: dotnet build tools/MetadataSharp.Dump/MetadataSharp.Dump.csproj --configuration Release -f net10.0
      - name: Checkout pinned upstream corpus (CI-time fetch; never vendored, never executed)
        uses: actions/checkout@v4
        with:
          repository: Exiv2/exiv2
          ref: b0859fc61fea5dedfc898aece6b15893ddf4314e
          path: artifacts/parity/exiv2
          persist-credentials: false
      - name: C# parity against upstream expectations and dynamic MakerNote gate
        shell: bash
        run: |
          dotnet build tools/MetadataSharp.Parity/MetadataSharp.Parity.csproj --configuration Release
          dotnet run --project tools/MetadataSharp.Parity/MetadataSharp.Parity.csproj --configuration Release --no-build -- \
            --tree artifacts/parity/exiv2 --dump-command "$DUMP" --out artifacts/parity/upstream \
            --title 'PARITY upstream' --rows-per-file 20000 --annotate --inventory --require-all-maker-notes \
            --require Exif.PentaxDng --require Exif.Pentax --require Exif.Canon --require Exif.CanonSi \
            --require Exif.CanonCs --require Exif.CanonFi --require Exif.CanonAfC --require Exif.CanonPi \
            --require Exif.CanonPa --require Exif.CanonAfMiAdj --require Exif.CanonAm --require Exif.CanonHdr \
            --require Exif.CanonLe --require Exif.CanonLiOp --require Exif.CanonMe --require Exif.CanonPr \
            --require Exif.CanonTi --require Exif.CanonVigCor2 --require Exif.Sony1 --require Exif.Sony2 \
            --require Exif.Sony2Fp --require Exif.SonyMisc1 --require Exif.Sony1Cs --require Exif.SonyMisc3c \
            --require Exif.SonyMisc2b --require Exif.SonyMinolta --require Exif.NikonLd3 --require Exif.NikonLd4 \
            --require Exif.NikonFl7 --require Exif.NikonFl6 --require Exif.NikonIi --require Exif.Nikon3 \
            --require Exif.NikonSi02xx --require Exif.Nikon1 --require Exif.Nikon2 --require Exif.NikonLd2 \
            --require Exif.NikonAf --require Exif.NikonFl1 --require Exif.NikonFl3 --require Exif.NikonAFT \
            --require Exif.NikonAf2 --require Exif.NikonAf22 --require Exif.NikonCb2b --require Exif.NikonCb3 \
            --require Exif.NikonCb4 --require Exif.NikonFi --require Exif.NikonMe --require Exif.NikonPc \
            --require Exif.NikonPreview --require Exif.NikonSi01xx --require Exif.NikonVr --require Exif.NikonWt \
            --require Exif.Fujifilm --require Exif.Panasonic --require Exif.Olympus --require Exif.Olympus2 \
            --require Exif.OlympusCs --require Exif.OlympusEq --require Exif.OlympusFi --require Exif.OlympusIp \
            --require Exif.OlympusRd --require Exif.Sigma --require Exif.Minolta --require Exif.MinoltaCs5D \
            --require Exif.MinoltaCs7D
      - name: Preview parity against upstream expectations (kind "Preview"; exiv2 -pp output read as text)
        shell: bash
        run: |
          python tools/parity/run_previews.py --tree artifacts/parity/exiv2 \
            --dump-command "$DUMP" --out artifacts/parity/preview --annotate
      # A gate, unlike the two measurements above: the profile is a run of bytes the file holds, so
      # every file the pinned tests give an "exiv2 -pC" output for has to give the same bytes here.
      - name: ICC parity against upstream expectations (kind "Icc"; the pinned tests of exiv2 -pC read as text)
        shell: bash
        run: |
          python tools/parity/run_icc.py --tree artifacts/parity/exiv2 \
            --dump-command "$DUMP" --out artifacts/parity/icc --annotate
      # No comparison: the ICC and comment readers take any bytes, and the corpus has files damaged
      # on purpose. Each file has to end with a result or a refusal that carries a code.
      - name: ICC and comment readers over every corpus file (a reader failure fails the job)
        shell: bash
        run: |
          python tools/parity/run_sweep.py --tree artifacts/parity/exiv2 \
            --dump-command "$DUMP" --out artifacts/parity/sweep --annotate
      # The oracle is the official 0.28.9 release binary from github.com: no apt, no compiler, no
      # 1-minute build. The Ubuntu package mirrors have failed DNS for hours at a time on the runners.
      - name: Download the pinned exiv2 release binary
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p artifacts/parity/exiv2-bin
          curl -fsSL --retry 5 --retry-delay 5 -o artifacts/parity/exiv2.tar.gz             https://github.com/Exiv2/exiv2/releases/download/v0.28.9/exiv2-0.28.9-Linux-x86_64.tar.gz
          echo "10041994  artifacts/parity/exiv2.tar.gz" | python -c "import sys,os; n,f=sys.stdin.read().split(); assert os.path.getsize(f)==int(n), 'unexpected size'"
          tar -xzf artifacts/parity/exiv2.tar.gz -C artifacts/parity/exiv2-bin --strip-components=1
          echo "LD_LIBRARY_PATH=$PWD/artifacts/parity/exiv2-bin/lib" >> "$GITHUB_ENV"
          artifacts/parity/exiv2-bin/bin/exiv2 --version | head -1
      # The packaged release binary omits the optional video readers. Build only the pinned 0.28.9
      # CLI from the checkout above with video enabled, and keep the release binary for other jobs.
      - name: Build pinned Exiv2 video-enabled oracle
        timeout-minutes: 10
        shell: bash
        run: |
          cmake -S artifacts/parity/exiv2 -B artifacts/parity/exiv2-video-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DEXIV2_ENABLE_VIDEO=ON -DEXIV2_ENABLE_XMP=ON -DEXIV2_ENABLE_EXTERNAL_XMP=OFF \
            -DEXIV2_ENABLE_PNG=OFF -DEXIV2_ENABLE_BMFF=OFF -DEXIV2_ENABLE_BROTLI=OFF \
            -DEXIV2_ENABLE_INIH=OFF -DEXIV2_ENABLE_LENSDATA=OFF -DEXIV2_ENABLE_NLS=OFF \
            -DEXIV2_BUILD_SAMPLES=OFF -DEXIV2_BUILD_UNIT_TESTS=OFF -DEXIV2_BUILD_DOC=OFF
          cmake --build artifacts/parity/exiv2-video-build --parallel 2 --target exiv2
          artifacts/parity/exiv2-video-build/bin/exiv2 -V
          echo "VIDEO_EXIV2=$PWD/artifacts/parity/exiv2-video-build/bin/exiv2" >> "$GITHUB_ENV"
      # Exiv2 0.28.9's video-enabled build still rejects RIFF/WAVE as unknown image type. Assert
      # that exact known limitation; WAV remains covered by MetadataSharp reader tests. If the oracle
      # starts supporting it, fail here so it can be added to parity rather than silently skipped.
      # Every other authored video fixture is read by the pinned tool; the gate enforces exact
      # key-set parity plus the two explicitly documented AVI value exceptions.
      - name: Video-container key and value parity (required gate)
        shell: bash
        run: |
          python tools/reference/video_fixtures.py verify tests/fixtures/video
          if "$VIDEO_EXIV2" -Pkycvt tests/fixtures/video/valid/authored-wave.wav > artifacts/parity/wave-oracle.txt 2>&1; then
            echo "Pinned Exiv2 now reads the authored WAV; add it to the required video key/value parity set."
            cat artifacts/parity/wave-oracle.txt
            exit 1
          fi
          grep -F "unknown image type" artifacts/parity/wave-oracle.txt
          mkdir -p artifacts/parity/video-corpus artifacts/parity/video-generated
          ln -s "$PWD/artifacts/parity/exiv2/test/data/sample_960x540.asf" artifacts/parity/video-corpus/sample_960x540.asf
          for fixture in authored-asf.asf authored-avi.avi authored-matroska.mkv authored-quicktime.mp4 authored-webm.webm; do
            ln -s "$PWD/tests/fixtures/video/valid/$fixture" "artifacts/parity/video-generated/$fixture"
          done
          VIDEO_REPORT_DIR="$PWD/artifacts/parity/video"
          dotnet run --project tools/MetadataSharp.Parity/MetadataSharp.Parity.csproj -c Release --no-build -- --tree artifacts/parity/exiv2 \
            --fixtures artifacts/parity/video-corpus --fixtures artifacts/parity/video-generated \
            --exiv2-command "$VIDEO_EXIV2 -Pkycvt" --require-reference-tags --rows-per-file 1000 \
            --dump-command "$DUMP" --out "$VIDEO_REPORT_DIR" --title 'PARITY video containers' --annotate
          test -s "$VIDEO_REPORT_DIR/parity-report.json"
          python tools/parity/video_gate.py "$VIDEO_REPORT_DIR/parity-report.json"
      # The pinned tree holds one CR3 file and no expectation for it, so the pinned tool reads it here.
      # Two measurements, no gate: key parity of the CMT boxes and the XMP box, and the preview list.
      - name: The CR3 file of the pinned corpus against the pinned tool (exiv2 -Pkycvt, exiv2 -pp)
        shell: bash
        run: |
          mkdir -p artifacts/parity/cr3-input
          cp artifacts/parity/exiv2/test/data/Canon-R6-pruned.CR3 artifacts/parity/cr3-input/
          dotnet run --project tools/MetadataSharp.Parity/MetadataSharp.Parity.csproj -c Release --no-build -- --fixtures artifacts/parity/cr3-input \
            --exiv2-command "artifacts/parity/exiv2-bin/bin/exiv2 -Pkycvt" \
            --dump-command "$DUMP" --out artifacts/parity/cr3 --title 'PARITY cr3' --annotate
          python tools/parity/run_previews.py --fixtures artifacts/parity/cr3-input \
            --exiv2-command "artifacts/parity/exiv2-bin/bin/exiv2 -pp" \
            --dump-command "$DUMP" --out artifacts/parity/cr3-preview --title 'PARITY cr3 preview' --annotate
      # The pinned tree has no MRW file and two RAF files of 120 bytes. Files are authored here from
      # files of the tree (tools/reference/raw_container_fixtures.py): a TIFF file as the TTW block of
      # an MRW file, a JPEG file and a TIFF structure in a RAF file; the CRW files are copied. The
      # pinned tool reads them in this job. A measurement, no gate.
      - name: MRW, RAF and CRW files against the pinned tool (exiv2 -Pkycvt)
        shell: bash
        run: |
          python tools/reference/raw_container_fixtures.py artifacts/parity/exiv2/test/data artifacts/parity/raw-input
          dotnet run --project tools/MetadataSharp.Parity/MetadataSharp.Parity.csproj -c Release --no-build -- --fixtures artifacts/parity/raw-input \
            --exiv2-command "artifacts/parity/exiv2-bin/bin/exiv2 -Pkycvt" \
            --dump-command "$DUMP" --out artifacts/parity/raw --title 'PARITY raw containers' --annotate
      - name: Generate this repository's own fixtures
        shell: bash
        run: |
          mkdir -p artifacts/parity/generated
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 -- generate artifacts/parity/generated
          for name in jpeg png tiff webp xmp; do
            python tools/reference/${name}_owned_fixtures.py generate artifacts/parity/generated
          done
          python tools/reference/dng_fixtures.py generate artifacts/parity/generated
          python tools/reference/eps_pgf_fixtures.py generate artifacts/parity/generated
      - name: Parity against owned fixtures (oracle is the pinned tool, run in this same job)
        shell: bash
        run: |
          dotnet run --project tools/MetadataSharp.Parity/MetadataSharp.Parity.csproj -c Release --no-build -- \
            --fixtures artifacts/parity/generated --fixtures tests/fixtures/b7 --fixtures tests/fixtures/b8 \
            --fixtures tests/fixtures/b9 --fixtures tests/fixtures/b10 --fixtures tests/fixtures/b11 \
            --fixtures tests/fixtures/b11l --fixtures tests/fixtures/b11eps \
            --exiv2-command "artifacts/parity/exiv2-bin/bin/exiv2 -Pkycvt" \
            --summary-command "artifacts/parity/exiv2-bin/bin/exiv2 -ps" \
            --dump-command "$DUMP" --out artifacts/parity/owned --title 'PARITY owned' --annotate
      # Not key parity: nothing here is compared with what this library reads. The pinned tool has
      # to read every file the TIFF-based writer edited, print what the edit wrote, and print
      # unchanged every line of the source file that the edit did not name.
      - name: Files edited by the TIFF-based writer still read in the pinned tool (exiv2 -pa)
        shell: bash
        run: |
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build -- tiff-based-edits artifacts/parity/edited
          python tools/reference/tiff_based_edits.py artifacts/parity/edited \
            --exiv2-command "artifacts/parity/exiv2-bin/bin/exiv2 -pa"
      # The same rule on the TIFF-based files of the pinned corpus: real camera files, and files
      # damaged on purpose. A refusal of the writer is counted by its code; a file it did write has
      # to read in the pinned tool as its source did, wherever the tool could read the source.
      - name: Corpus files edited by the TIFF-based writer still read in the pinned tool (exiv2 -pa)
        shell: bash
        run: |
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build -- tiff-based-corpus artifacts/parity/exiv2/test/data artifacts/parity/edited-corpus
          python tools/reference/tiff_based_edits.py artifacts/parity/edited-corpus --skip-unreadable-sources \
            --title "TIFF-based corpus edits" --exiv2-command "artifacts/parity/exiv2-bin/bin/exiv2 -pa"
      # The same rule for the BMFF writer: authored HEIC and AVIF files in the layouts whose item
      # location box the pinned tool reads, after each kind of edit; then the HEIC, HEIF and AVIF
      # files of the pinned corpus, where a refusal of the writer is counted by its code.
      - name: Files edited by the BMFF writer still read in the pinned tool (exiv2 -pa)
        shell: bash
        run: |
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build -- bmff-edits artifacts/parity/edited-bmff
          python tools/reference/tiff_based_edits.py artifacts/parity/edited-bmff \
            --title "BMFF edits" --exiv2-command "artifacts/parity/exiv2-bin/bin/exiv2 -pa"
      - name: Corpus files edited by the BMFF writer still read in the pinned tool (exiv2 -pa)
        shell: bash
        run: |
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build -- bmff-corpus artifacts/parity/exiv2/test/data artifacts/parity/edited-bmff-corpus
          python tools/reference/tiff_based_edits.py artifacts/parity/edited-bmff-corpus --skip-unreadable-sources \
            --title "BMFF corpus edits" --exiv2-command "artifacts/parity/exiv2-bin/bin/exiv2 -pa"
      # The same rule for an edit of any tag. Authored blocks with all five directories, a MakerNote,
      # a tag no vocabulary lists and a thumbnail, in a JPEG, a PNG, a WebP, a TIFF and a HEIC file,
      # after tags of every directory and field type were set, written in place, taken out again,
      # after directories were added and dropped, and after a file without a block was given one.
      # The tool prints a tag it has no name for only with -u, and such tags are among those set.
      - name: Files after an edit of any EXIF tag still read in the pinned tool (exiv2 -u -pa)
        shell: bash
        run: |
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build -- exif-tag-edits artifacts/parity/edited-tags
          python tools/reference/tiff_based_edits.py artifacts/parity/edited-tags \
            --title "Any-tag EXIF edits" --exiv2-command "artifacts/parity/exiv2-bin/bin/exiv2 -u -pa"
      # Then the JPEG, PNG and WebP files of the pinned corpus, whose EXIF block is edited where it
      # lies: what the tool prints of a MakerNote after the edit has to be what it printed before.
      - name: Corpus JPEG, PNG and WebP files after an edit of any EXIF tag still read in the pinned tool (exiv2 -u -pa)
        shell: bash
        run: |
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build -- exif-tag-corpus artifacts/parity/exiv2/test/data artifacts/parity/edited-tags-corpus
          python tools/reference/tiff_based_edits.py artifacts/parity/edited-tags-corpus --skip-unreadable-sources \
            --title "Any-tag EXIF corpus edits" --exiv2-command "artifacts/parity/exiv2-bin/bin/exiv2 -u -pa"
      # The rule for an XMP edit by path is stricter, since the files are authored and everything in
      # their packets was written here: the tool has to print every property as it was written and
      # no other (-pa), and take the packet out as one well-formed document (-pX). Every node kind
      # and a namespace of the edit's own, a second edit of the result, in JPEG, PNG, WebP, TIFF,
      # HEIC and a sidecar; and a JPEG file whose packet is Extended XMP, before and after.
      - name: Every XMP property an edit wrote is printed by the pinned tool (exiv2 -pa, -pX)
        shell: bash
        run: |
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build -- xmp-edits artifacts/parity/edited-xmp
          python tools/reference/xmp_edits.py artifacts/parity/edited-xmp --exiv2 artifacts/parity/exiv2-bin/bin/exiv2
      # Not key parity either: the pinned tool has to print, with -pi and -pa, every IPTC dataset an
      # edit wrote into a JPEG, a TIFF (tag 0x83BB, and the resources of tag 0x8649) and a PNG file
      # (the raw profile text chunk), as often as it was written, and no other.
      - name: Every IPTC dataset an edit wrote is printed by the pinned tool (exiv2 -u -pi, -pa)
        shell: bash
        run: |
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build -- iptc-edits artifacts/parity/edited-iptc
          python tools/reference/iptc_edits.py artifacts/parity/edited-iptc --exiv2 artifacts/parity/exiv2-bin/bin/exiv2
      # Not key parity either: the pinned tool has to print, with -pC and -pc, the ICC profile and
      # the comment the JPEG writer gave a file, replaced or took out, and with -pa what it printed
      # for the file the edit started from. Authored files first, then the JPEG files of the pinned
      # corpus, where a refusal of the writer is counted by its code.
      - name: Profiles and comments written into JPEG files are printed by the pinned tool (exiv2 -pC, -pc)
        shell: bash
        run: |
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build -- jpeg-embedded-edits artifacts/parity/edited-embedded
          python tools/reference/embedded_edits.py artifacts/parity/edited-embedded --exiv2 artifacts/parity/exiv2-bin/bin/exiv2
      - name: Profiles and comments written into corpus JPEG files are printed by the pinned tool (exiv2 -pC, -pc)
        shell: bash
        run: |
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build -- jpeg-embedded-corpus artifacts/parity/exiv2/test/data artifacts/parity/edited-embedded-corpus
          python tools/reference/embedded_edits.py artifacts/parity/edited-embedded-corpus --skip-unreadable-sources \
            --title "JPEG corpus profile and comment edits" --exiv2 artifacts/parity/exiv2-bin/bin/exiv2
      - name: Profiles and comments written into PNG and WebP files are read by the pinned tool (exiv2 -pC, -pS)
        shell: bash
        run: |
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build -- png-webp-embedded-edits artifacts/parity/edited-embedded-png-webp
          python tools/reference/embedded_edits.py artifacts/parity/edited-embedded-png-webp \
            --title "PNG and WebP profile and comment edits" --exiv2 artifacts/parity/exiv2-bin/bin/exiv2
          python tools/reference/png_chunk_edits.py artifacts/parity/edited-embedded-png-webp --exiv2 artifacts/parity/exiv2-bin/bin/exiv2
      - name: Profiles and comments written into corpus PNG and WebP files are read by the pinned tool (exiv2 -pC, -pS)
        shell: bash
        run: |
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build -- png-webp-embedded-corpus artifacts/parity/exiv2/test/data artifacts/parity/edited-embedded-png-webp-corpus
          python tools/reference/embedded_edits.py artifacts/parity/edited-embedded-png-webp-corpus --skip-unreadable-sources \
            --title "PNG and WebP corpus profile and comment edits" --exiv2 artifacts/parity/exiv2-bin/bin/exiv2
          python tools/reference/png_chunk_edits.py artifacts/parity/edited-embedded-png-webp-corpus --skip-unreadable-sources \
            --title "PNG corpus profile and comment chunks" --exiv2 artifacts/parity/exiv2-bin/bin/exiv2
      # The same rule for the profile of a TIFF-based file (tag 0x8773 of the first directory) and of
      # a HEIC, HEIF or AVIF file (a colr property of the primary item). The tool prints the field of
      # a TIFF-based file with -pa as well: that key is named, left out of the comparison of the
      # other keys, and has to be printed exactly where the file is to have a profile.
      - name: Profiles written into TIFF-based and BMFF files are printed by the pinned tool (exiv2 -pC)
        shell: bash
        run: |
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build -- tiff-based-icc-edits artifacts/parity/edited-icc-tiff
          python tools/reference/embedded_edits.py artifacts/parity/edited-icc-tiff --profile-key Exif.Image.InterColorProfile \
            --title "TIFF-based profile edits" --exiv2 artifacts/parity/exiv2-bin/bin/exiv2
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build -- bmff-icc-edits artifacts/parity/edited-icc-bmff
          python tools/reference/embedded_edits.py artifacts/parity/edited-icc-bmff \
            --title "BMFF profile edits" --exiv2 artifacts/parity/exiv2-bin/bin/exiv2
      - name: Profiles written into corpus TIFF-based and BMFF files are printed by the pinned tool (exiv2 -pC)
        shell: bash
        run: |
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build -- tiff-based-icc-corpus artifacts/parity/exiv2/test/data artifacts/parity/edited-icc-tiff-corpus
          python tools/reference/embedded_edits.py artifacts/parity/edited-icc-tiff-corpus --skip-unreadable-sources --profile-key Exif.Image.InterColorProfile \
            --title "TIFF-based corpus profile edits" --exiv2 artifacts/parity/exiv2-bin/bin/exiv2
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build -- bmff-icc-corpus artifacts/parity/exiv2/test/data artifacts/parity/edited-icc-bmff-corpus
          python tools/reference/embedded_edits.py artifacts/parity/edited-icc-bmff-corpus --skip-unreadable-sources \
            --title "BMFF corpus profile edits" --exiv2 artifacts/parity/exiv2-bin/bin/exiv2
      - name: Upload parity reports (measurements only - no corpus bytes, no external source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-parity
          path: |
            artifacts/parity/upstream/parity-report.txt
            artifacts/parity/upstream/parity-report.json
            artifacts/parity/video/parity-report.txt
            artifacts/parity/video/parity-report.json
            artifacts/parity/preview/preview-report.txt
            artifacts/parity/preview/preview-report.json
            artifacts/parity/icc/icc-report.txt
            artifacts/parity/icc/icc-report.json
            artifacts/parity/sweep/sweep-report.txt
            artifacts/parity/sweep/sweep-report.json
            artifacts/parity/owned/parity-report.txt
            artifacts/parity/owned/parity-report.json
            artifacts/parity/cr3/parity-report.txt
            artifacts/parity/cr3/parity-report.json
            artifacts/parity/cr3-preview/preview-report.txt
            artifacts/parity/cr3-preview/preview-report.json
          retention-days: 30
      # Not key parity either: what ExifToXmp and XmpToExif produce is held against the conversion
      # the pinned tool does itself when it writes an XMP sidecar from a file (exiv2 -eX) and when
      # it reads one. The JPEG files of the pinned corpus, with EXIF as their only metadata. Every
      # difference has to be one tools/reference/sync_parity.py documents with its reason.
      - name: ExifToXmp and XmpToExif against the conversion of the pinned tool (exiv2 -eX, -PXkv, -PEkv)
        shell: bash
        env:
          TZ: UTC
        run: |
          python tools/reference/sync_parity.py artifacts/parity/exiv2/test/data artifacts/parity/sync \
            --exiv2 artifacts/parity/exiv2-bin/bin/exiv2 \
            --fixture "dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build --"

  # A separate check from key parity, in a job of its own so that its report is not cut by the
  # annotation budget of the parity job: the operations of the tool's command line (adjust, modify,
  # delete, extract, insert, thumbnail, fixiso, fixcom, rename) against the operations this library
  # offers for the same purpose, on copies of the JPEG files of the pinned corpus; both results are
  # printed with exiv2 -pa. Every difference has to be one tools/reference/operations_parity.py
  # documents with its reason.
  operations-parity:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Exiv2 0.28.9 / operations parity
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      LC_ALL: C
      TZ: UTC
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the fixture generator
        run: dotnet build tools/MetadataSharp.ReferenceFixture/MetadataSharp.ReferenceFixture.csproj --configuration Release -f net10.0
      - name: Checkout pinned upstream corpus (CI-time fetch; never vendored, never executed)
        uses: actions/checkout@v4
        with:
          repository: Exiv2/exiv2
          ref: b0859fc61fea5dedfc898aece6b15893ddf4314e
          path: artifacts/parity/exiv2
          persist-credentials: false
      - name: Download the pinned exiv2 release binary
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p artifacts/parity/exiv2-bin
          curl -fsSL --retry 5 --retry-delay 5 -o artifacts/parity/exiv2.tar.gz https://github.com/Exiv2/exiv2/releases/download/v0.28.9/exiv2-0.28.9-Linux-x86_64.tar.gz
          echo "10041994  artifacts/parity/exiv2.tar.gz" | python -c "import sys,os; n,f=sys.stdin.read().split(); assert os.path.getsize(f)==int(n), 'unexpected size'"
          tar -xzf artifacts/parity/exiv2.tar.gz -C artifacts/parity/exiv2-bin --strip-components=1
          echo "LD_LIBRARY_PATH=$PWD/artifacts/parity/exiv2-bin/lib" >> "$GITHUB_ENV"
          artifacts/parity/exiv2-bin/bin/exiv2 --version | head -1
      - name: The operations of the command line against the pinned tool (exiv2 ad, mo, rm, ex, in, fi, fc, mv; -pa)
        shell: bash
        run: |
          python tools/reference/operations_parity.py artifacts/parity/exiv2/test/data artifacts/parity/operations \
            --exiv2 artifacts/parity/exiv2-bin/bin/exiv2 \
            --fixture "dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build --"

  # EPS and PGF writers are checked in both directions: Exiv2 reads our output, then our entry
  # point reads output written by the pinned binary. The authored EPS/PGF fixtures are the only inputs.
  eps-pgf-write-parity:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Exiv2 0.28.9 / EPS and PGF write parity
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      LC_ALL: C
      TZ: UTC
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the fixture generator
        run: dotnet build tools/MetadataSharp.ReferenceFixture/MetadataSharp.ReferenceFixture.csproj --configuration Release -f net10.0
      - name: Download the pinned exiv2 release binary
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p artifacts/parity/exiv2-bin
          curl -fsSL --retry 5 --retry-delay 5 -o artifacts/parity/exiv2.tar.gz https://github.com/Exiv2/exiv2/releases/download/v0.28.9/exiv2-0.28.9-Linux-x86_64.tar.gz
          echo "10041994  artifacts/parity/exiv2.tar.gz" | python -c "import sys,os; n,f=sys.stdin.read().split(); assert os.path.getsize(f)==int(n), 'unexpected size'"
          tar -xzf artifacts/parity/exiv2.tar.gz -C artifacts/parity/exiv2-bin --strip-components=1
          echo "LD_LIBRARY_PATH=$PWD/artifacts/parity/exiv2-bin/lib" >> "$GITHUB_ENV"
      - name: Write and read EPS and PGF in both directions
        shell: bash
        run: |
          python tools/reference/eps_pgf_write_parity.py tests/fixtures/b11eps artifacts/parity/eps-pgf-writes \
            --exiv2 artifacts/parity/exiv2-bin/bin/exiv2 \
            --fixture "dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build --"
      - name: Keep the measured writer parity report
        uses: actions/upload-artifact@v4
        with:
          name: eps-pgf-writer-parity
          path: artifacts/parity/eps-pgf-writes/write-parity.json
          retention-days: 30

  # MakerNote tags that this library sets (in place, and appended where a value grows), in copies of
  # the JPEG and raw files of the pinned corpus; the pinned tool has to print the key with the value
  # that was set and every other key as before (tools/reference/makernote_parity.py).
  makernote-parity:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Exiv2 0.28.9 / MakerNote edit parity
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      LC_ALL: C
      TZ: UTC
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the fixture generator
        run: dotnet build tools/MetadataSharp.ReferenceFixture/MetadataSharp.ReferenceFixture.csproj --configuration Release -f net10.0
      - name: Checkout pinned upstream corpus (CI-time fetch; never vendored, never executed)
        uses: actions/checkout@v4
        with:
          repository: Exiv2/exiv2
          ref: b0859fc61fea5dedfc898aece6b15893ddf4314e
          path: artifacts/parity/exiv2
          persist-credentials: false
      - name: Download the pinned exiv2 release binary
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p artifacts/parity/exiv2-bin
          curl -fsSL --retry 5 --retry-delay 5 -o artifacts/parity/exiv2.tar.gz https://github.com/Exiv2/exiv2/releases/download/v0.28.9/exiv2-0.28.9-Linux-x86_64.tar.gz
          echo "10041994  artifacts/parity/exiv2.tar.gz" | python -c "import sys,os; n,f=sys.stdin.read().split(); assert os.path.getsize(f)==int(n), 'unexpected size'"
          tar -xzf artifacts/parity/exiv2.tar.gz -C artifacts/parity/exiv2-bin --strip-components=1
          echo "LD_LIBRARY_PATH=$PWD/artifacts/parity/exiv2-bin/lib" >> "$GITHUB_ENV"
          artifacts/parity/exiv2-bin/bin/exiv2 --version | head -1
      - name: MakerNote edit and copy relocation parity against pinned Exiv2 (exiv2 -u -PEkv)
        shell: bash
        run: |
          python tools/reference/makernote_parity.py artifacts/parity/exiv2/test/data artifacts/parity/makernote \
            --exiv2 artifacts/parity/exiv2-bin/bin/exiv2 \
            --fixture "dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build --"
      - name: Upload corpus MakerNote copy disposition report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: makernote-copy-parity
          path: artifacts/parity/makernote/copy-report.json
          if-no-files-found: ignore
          retention-days: 30
      # Tags and the comment that this library writes into the records of the CRW files of the pinned
      # corpus; the pinned tool has to print what was set and every other key as before
      # (tools/reference/crw_parity.py).
      - name: CRW tags and comment set by this library, read back by the pinned tool (exiv2 -u -PEkv, exiv2 -pc)
        shell: bash
        run: |
          python tools/reference/crw_parity.py artifacts/parity/exiv2/test/data artifacts/parity/crw \
            --exiv2 artifacts/parity/exiv2-bin/bin/exiv2 \
            --fixture "dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 --no-build --"
