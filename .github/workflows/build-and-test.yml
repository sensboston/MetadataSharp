name: Build and test

on:
  push:
    branches: [master, 'arena/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.tfm }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        tfm: [net8.0, net10.0]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 8 and 10 SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Record SDK and runtime environment
        run: dotnet --info
      - name: Restore
        run: dotnet restore MetadataSharp.sln
      - name: Build Release
        run: dotnet build MetadataSharp.sln --configuration Release --no-restore
      - name: Test offline reference-harness policy
        shell: bash
        run: python -m unittest discover -s tests/reference -v 2>&1 | tee reference.log
      # The differential parity harness is checked the same offline way: its rules are string
      # transformations over a grammar both sides of the comparison agree on, so they are testable
      # without a corpus, a build, or the external tool being present.
      - name: Test offline parity-harness policy
        shell: bash
        run: python -m unittest discover -s tests/parity -v 2>&1 | tee parity.log
      - name: Verify discovery seed policy
        shell: bash
        run: |
          python tools/reference/build_capability_seeds.py --check
          python tools/reference/build_census.py --check
          python -m unittest discover -s tests/discovery -v 2>&1 | tee discovery.log
      # Python-suite detail is published the same way the .NET trx failures below are. The
      # Actions log host is not readable from every environment that recovers this repo's
      # evidence, and a red leg that reports only "exit code 1" costs a whole round trip:
      # a Windows-only line-ending failure in the B10 evidence digests sat behind exactly that
      # for two pushes. unittest writes failures to stderr, so the steps above tee their merged
      # output to a file and this step turns the failing names into annotations.
      - name: Report failed Python policy details
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          found = False
          for log in (Path('reference.log'), Path('parity.log'), Path('discovery.log')):
              if not log.exists():
                  continue
              lines = log.read_text(encoding='utf-8', errors='replace').splitlines()
              # A traceback's first line names nothing; the reason is two or three lines further down.
              wanted = set()
              for index, line in enumerate(lines):
                  if line.startswith(('FAIL:', 'ERROR:', 'AssertionError', 'Traceback', 'FAILED', 'Ran ')):
                      wanted.update(range(index, min(index + 5, len(lines))))
              picked = [lines[index] for index in sorted(wanted)][:24]
              for line in picked or lines[-12:]:
                  text = line[:2000].replace('%', '%25').replace('\r', '%0D')
                  print('::error title=Python policy failure (' + log.name + ')::' + text)
                  found = True
          if not found:
              print('::error title=Python policy failure::no suite log: a step failed before '
                    'writing one (check the --check scripts and the step order)')
      - name: Test Release
        run: dotnet test tests/MetadataSharp.Tests/MetadataSharp.Tests.csproj --framework ${{ matrix.tfm }} --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults/${{ matrix.tfm }}
      - name: Report failed test details
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          for path in Path('TestResults').rglob('*.trx'):
              for result in ET.parse(path).getroot().findall('.//t:UnitTestResult', ns):
                  if result.get('outcome') == 'Failed':
                      text = result.get('testName', '') + ': ' + ' '.join(result.itertext())
                      text = text[:6000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Unit test failure::' + text)
      - name: Verify tests actually ran
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('TestResults').rglob('*.trx'))
          if not files:
              raise SystemExit('No TRX results found')
          total = 0
          for file in files:
              root = ET.parse(file).getroot()
              ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
              counters = root.find('t:ResultSummary/t:Counters', ns)
              if counters is None:
                  raise SystemExit(f'No test counters in {file}')
              count = int(counters.attrib['total'])
              passed = int(counters.attrib['passed'])
              if count != passed:
                  raise SystemExit(f'Not all tests passed in {file}: {counters.attrib}')
              total += count
          if total < 450:
              raise SystemExit(f'Expected at least 450 M01–M16 cases, got {total}')
          print(f'::notice title=Executed test count::Validated {total} passing tests')
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.tfm }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7

  external-reference:
    name: References / ${{ matrix.tfm }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0, net10.0]
    timeout-minutes: 15
    env:
      LC_ALL: C
      METADATASHARP_REFERENCE_TFM: ${{ matrix.tfm }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install external CLI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y exiv2 libimage-exiftool-perl webp
          mkdir -p artifacts/reference
          dpkg-query -W exiv2 libimage-exiftool-perl webp > artifacts/reference/packages.txt
          cp /usr/share/doc/exiv2/copyright artifacts/reference/exiv2-copyright.txt
          cp /usr/share/doc/libimage-exiftool-perl/copyright artifacts/reference/exiftool-copyright.txt
          cp /usr/share/doc/webp/copyright artifacts/reference/webp-copyright.txt
          dotnet --info > artifacts/reference/dotnet-info.txt
      - name: Build fixture generator and public API consumer
        run: dotnet build MetadataSharp.sln --configuration Release
      - name: Required differential and validation checks
        run: python tools/reference/harness.py --required
      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-reference-evidence-${{ matrix.tfm }}
          path: artifacts/reference/
          if-no-files-found: warn
          retention-days: 7

  performance-package-audit:
    name: Audit / ${{ matrix.os }} / ${{ matrix.tfm }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        tfm: [net8.0, net10.0]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      AUDIT_TFM: ${{ matrix.tfm }}
      AUDIT_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Record SDK and environment
        run: dotnet --info
      - name: Measure and audit local candidates
        run: python tools/audit/run.py
      - name: Upload audit evidence (never publish packages)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.os }}-${{ matrix.tfm }}
          path: |
            artifacts/audit/**/baseline.json
            artifacts/audit/**/packages.json
          if-no-files-found: error
          retention-days: 30

  pinned-exiv2-baseline:
    name: Exiv2 0.28.9 / bounded E01 observations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LC_ALL: C
      E01_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned external black-box source (never production dependency)
        uses: actions/checkout@v4
        with:
          repository: Exiv2/exiv2
          ref: b0859fc61fea5dedfc898aece6b15893ddf4314e
          path: artifacts/e01/source
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install external build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libexpat1-dev zlib1g-dev libbrotli-dev libinih-dev libfmt-dev
      - name: Configure external black-box build with explicit policy
        shell: python
        run: |
          import subprocess, sys
          sys.path.insert(0, 'tools/reference')
          from exiv2_baseline import OPTIONS
          subprocess.run(['cmake', '-S', 'artifacts/e01/source', '-B', 'artifacts/e01/build', '-G', 'Ninja',
                          *[f'-D{k}={v}' for k, v in OPTIONS.items()]], check=True)
      - name: Build only external executable (no upstream tests or fixture imports)
        run: cmake --build artifacts/e01/build --target exiv2 --parallel 2
      - name: Required pinned observations with independent raw-byte expectations
        run: python tools/reference/exiv2_baseline.py --upstream artifacts/e01/source --build artifacts/e01/build
      - name: B0+B1 census observation batches (pinned CLI, outcomes recorded not gated)
        run: python tools/reference/observe_b0.py --upstream artifacts/e01/source --build artifacts/e01/build --batch all
      - name: B2 census observation batch (pinned CLI, outcomes recorded not gated)
        run: python tools/reference/observe_b2.py --upstream artifacts/e01/source --build artifacts/e01/build
      - name: B3 census observation batch (pinned CLI, outcomes recorded not gated)
        run: python tools/reference/observe_b3.py --upstream artifacts/e01/source --build artifacts/e01/build
      - name: B4 census observation batch (pinned CLI, outcomes recorded not gated)
        run: python tools/reference/observe_b4.py --upstream artifacts/e01/source --build artifacts/e01/build
      - name: B5 census observation batch (pinned CLI, outcomes recorded not gated)
        run: python tools/reference/observe_b5.py --upstream artifacts/e01/source --build artifacts/e01/build
      - name: B6 census observation batch (pinned CLI, outcomes recorded not gated)
        run: python tools/reference/observe_b6.py --upstream artifacts/e01/source --build artifacts/e01/build
      - name: Checkout pinned ExifTool secondary reference (never a product dependency)
        uses: actions/checkout@v4
        with:
          repository: ExifTool/exiftool
          ref: 212f02cf22b9484674752181cad3b73089ce9694
          path: artifacts/e01/exiftool
          persist-credentials: false
      - name: Select Python 3.11 for reproducible B7 fixture encoders
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hash-pinned external B7 fixture encoders
        run: python -m pip install --require-hashes -r tools/reference/b7-encoder-requirements.txt
      - name: Re-encode and verify authored B7 fixtures
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'tools/reference')
          import b7_owned_fixtures as fixtures
          manifest = fixtures.verify()
          encoded = fixtures.encode_catalog()
          if set(encoded) != {entry['file'] for entry in manifest}:
              raise SystemExit('B7 generated fixture set differs from manifest')
          for name, data in encoded.items():
              if data != (fixtures.FIXTURES / name).read_bytes():
                  raise SystemExit('B7 fixture re-encoding mismatch: ' + name)
      - name: B7 census observation batch (pinned CLI and secondary reference, outcomes recorded not gated)
        run: python tools/reference/observe_b7.py --upstream artifacts/e01/source --build artifacts/e01/build --exiftool-checkout artifacts/e01/exiftool
      - name: Verify authored B8 PSD research fixtures
        run: python tools/reference/b8_psd_fixture.py verify
      - name: Verify and regenerate authored B8 JP2 research fixture
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'tools/reference')
          import b8_jp2_fixture as fixture
          fixture.verify()
          if fixture.encode() != (fixture.DIRECTORY / fixture.FILE).read_bytes():
              raise SystemExit('B8 JP2 fixture regeneration mismatch')
      - name: Verify authored B8 EPS research fixture
        run: python tools/reference/b8_eps_fixture.py verify
      - name: Verify the B8 census fixture catalog and byte structure
        run: python tools/reference/b8_census_fixtures.py verify
      - name: B8 PSD preflight (read-only, outcomes recorded not gated)
        run: python tools/reference/probe_b8_psd.py --upstream artifacts/e01/source --build artifacts/e01/build --exiftool-checkout artifacts/e01/exiftool
      - name: B8 EPS preflight (read-only, PostScript never executed)
        run: python tools/reference/probe_b8_eps.py --upstream artifacts/e01/source --build artifacts/e01/build --exiftool-checkout artifacts/e01/exiftool
      - name: Upload B8 EPS preflight (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b8-eps-preflight
          path: artifacts/e01/b8-eps-preflight/observations.json
          if-no-files-found: error
          retention-days: 30
      - name: B8 JP2 preflight (read-only, outcomes recorded not gated)
        run: python tools/reference/probe_b8_jp2.py --upstream artifacts/e01/source --build artifacts/e01/build --exiftool-checkout artifacts/e01/exiftool
      - name: Upload B8 JP2 preflight (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b8-jp2-preflight
          path: artifacts/e01/b8-jp2-preflight/observations.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload B8 PSD preflight (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b8-psd-preflight
          path: artifacts/e01/b8-psd-preflight/observations.json
          if-no-files-found: error
          retention-days: 30
      - name: B8 census observation batch (pinned CLI and secondary reference, outcomes recorded not gated)
        run: python tools/reference/observe_b8.py --upstream artifacts/e01/source --build artifacts/e01/build --exiftool-checkout artifacts/e01/exiftool
      - name: Upload B8 census observations (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b8-census-observations
          path: artifacts/e01/b8/observations.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload authored observations and reproducibility metadata (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-exiv2-0289-observations
          path: |
            artifacts/e01/observations/observations.json
            artifacts/e01/observations/verbose-version.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload B0 census observations and fixture manifest (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b0-census-observations
          path: |
            artifacts/e01/b0/observations.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload B1 census observations and fixture manifest (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b1-census-observations
          path: |
            artifacts/e01/b1/observations.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload B2 census observations and fixture manifest (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b2-census-observations
          path: |
            artifacts/e01/b2/observations.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload B3 census observations and fixture manifest (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b3-census-observations
          path: |
            artifacts/e01/b3/observations.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload B4 census observations and fixture manifest (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b4-census-observations
          path: |
            artifacts/e01/b4/observations.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload B5 census observations and fixture manifest (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b5-census-observations
          path: |
            artifacts/e01/b5/observations.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload B6 census observations (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b6-census-observations
          path: |
            artifacts/e01/b6/observations.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload B7 census observations (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b7-census-observations
          path: |
            artifacts/e01/b7/observations.json
          if-no-files-found: error
          retention-days: 30

  # Batch B9 runs in its own job on purpose. Check runs accept at most 50
  # annotations, and the B0-B8 steps already emit 50, so a new batch appended to that
  # job is dropped silently: its report still lands in the uploaded artifact, but the
  # artifact blob host is unreachable from this sandbox, which leaves the annotation
  # channel as the only way to recover evidence. A separate job buys a fresh
  # annotation budget. Later batches extend *this* job, and the recorder's
  # `count=` marker is checked during recovery before any evidence is trusted.
  # It rebuilds the same pinned source; no .NET SDK is needed for observation.
  pinned-exiv2-b9:
    name: Exiv2 0.28.9 / bounded E01 B9 RAW observations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LC_ALL: C
      E01_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned external black-box source (never production dependency)
        uses: actions/checkout@v4
        with:
          repository: Exiv2/exiv2
          ref: b0859fc61fea5dedfc898aece6b15893ddf4314e
          path: artifacts/e01/source
          persist-credentials: false
      - name: Install external build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libexpat1-dev zlib1g-dev libbrotli-dev libinih-dev libfmt-dev
      - name: Configure external black-box build with explicit policy
        shell: python
        run: |
          import subprocess, sys
          sys.path.insert(0, 'tools/reference')
          from exiv2_baseline import OPTIONS
          subprocess.run(['cmake', '-S', 'artifacts/e01/source', '-B', 'artifacts/e01/build', '-G', 'Ninja',
                          *[f'-D{k}={v}' for k, v in OPTIONS.items()]], check=True)
      - name: Build only external executable (no upstream tests or fixture imports)
        run: cmake --build artifacts/e01/build --target exiv2 --parallel 2
      - name: Checkout pinned ExifTool secondary reference (never a product dependency)
        uses: actions/checkout@v4
        with:
          repository: ExifTool/exiftool
          ref: 212f02cf22b9484674752181cad3b73089ce9694
          path: artifacts/e01/exiftool
          persist-credentials: false
      - name: Verify the B9 census fixture catalog and byte structure
        run: python tools/reference/b9_raw_fixtures.py verify
      - name: B9 RAW-marker preflight (read-only, vendor IFDs never invented)
        run: python tools/reference/probe_b9_raw.py --upstream artifacts/e01/source --build artifacts/e01/build --exiftool-checkout artifacts/e01/exiftool
      - name: B9 census observation batch (pinned CLI and secondary reference, outcomes recorded not gated)
        run: python tools/reference/observe_b9.py --upstream artifacts/e01/source --build artifacts/e01/build --exiftool-checkout artifacts/e01/exiftool
      - name: Upload B9 census observations (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b9-census-observations
          path: artifacts/e01/b9/observations.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload B9 RAW preflight (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b9-raw-preflight
          path: artifacts/e01/b9-raw-preflight/observations.json
          if-no-files-found: error
          retention-days: 30
  # B10 is wave 2 of the RAW series: MRW / RW2 / SR2 / RAF. It gets its own job for the
  # same reason B9 does, and the arithmetic is the binding constraint rather than a style
  # choice. GitHub caps a check run at 50 annotations and drops the overflow silently, the
  # B0-B8 baseline job already emits exactly 50, and the Actions log and artifact blob are
  # unreachable from the recovery environment -- so an annotation-overflowed batch would
  # look like a batch that never ran. B10's two recorders cap themselves at 10 chunks
  # each (see `chunks(..., limit=10)` and the preflight's own guard), so this job stays
  # inside a fresh budget even when both reports are recovered whole. The `count=` marker
  # in each annotation title is checked during recovery before any evidence is trusted.
  # It rebuilds the same pinned source; no .NET SDK is needed for observation.
  pinned-exiv2-b10:
    name: Exiv2 0.28.9 / bounded E01 B10 wave-2 RAW observations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LC_ALL: C
      E01_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned external black-box source (never production dependency)
        uses: actions/checkout@v4
        with:
          repository: Exiv2/exiv2
          ref: b0859fc61fea5dedfc898aece6b15893ddf4314e
          path: artifacts/e01/source
          persist-credentials: false
      - name: Install external build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libexpat1-dev zlib1g-dev libbrotli-dev libinih-dev libfmt-dev
      - name: Configure external black-box build with explicit policy
        shell: python
        run: |
          import subprocess, sys
          sys.path.insert(0, 'tools/reference')
          from exiv2_baseline import OPTIONS
          subprocess.run(['cmake', '-S', 'artifacts/e01/source', '-B', 'artifacts/e01/build', '-G', 'Ninja',
                          *[f'-D{k}={v}' for k, v in OPTIONS.items()]], check=True)
      - name: Build only external executable (no upstream tests or fixture imports)
        run: cmake --build artifacts/e01/build --target exiv2 --parallel 2
      - name: Checkout pinned ExifTool secondary reference (never a product dependency)
        uses: actions/checkout@v4
        with:
          repository: ExifTool/exiftool
          ref: 212f02cf22b9484674752181cad3b73089ce9694
          path: artifacts/e01/exiftool
          persist-credentials: false
      - name: Verify the B10 census fixture catalog and byte structure
        run: python tools/reference/b10_raw_fixtures.py verify
      - name: B10 wave-2 preflight (read-only, vendor-private blocks never invented)
        run: python tools/reference/probe_b10_raw.py --upstream artifacts/e01/source --build artifacts/e01/build --exiftool-checkout artifacts/e01/exiftool
      - name: B10 census observation batch (pinned CLI and secondary reference, outcomes recorded not gated)
        run: python tools/reference/observe_b10.py --upstream artifacts/e01/source --build artifacts/e01/build --exiftool-checkout artifacts/e01/exiftool
      - name: Upload B10 census observations (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b10-census-observations
          path: artifacts/e01/b10/observations.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload B10 wave-2 preflight (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b10-raw-preflight
          path: artifacts/e01/b10-raw-preflight/observations.json
          if-no-files-found: error
          retention-days: 30
  # B11 is the small-format and container batch: owned CIFF, BMP, GIF and TGA fixtures plus five
  # container stubs, and the last 24 pending seed cells. Two budgets drive its shape. GitHub caps
  # a check run at 50 annotations and drops the overflow silently, and the Actions log plus the
  # artifact blob are unreachable from the recovery environment, so this job's two recorders cap
  # themselves at 30 (census, 95 rows) and 12 (preflight, 107 flag-runs) instead of sharing one
  # limit -- 42 leaves the failure-annotation step its headroom. `TZ: UTC0` is not cosmetic:
  # CrwMap::decode0x180e renders the CIFF date through localtime_r, so without a pinned offset the
  # DateTime text would differ between runners and the three agreement runs this batch requires
  # could never agree. MP4 is deliberately absent as a format: which reader an .mp4 reaches is a
  # property of the brand at offset 8, so the brand pair is enumerated under MOV.
  pinned-exiv2-b11:
    name: Exiv2 0.28.9 / bounded E01 B11 container and small-format observations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LC_ALL: C
      TZ: UTC0
      E01_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned external black-box source (never production dependency)
        uses: actions/checkout@v4
        with:
          repository: Exiv2/exiv2
          ref: b0859fc61fea5dedfc898aece6b15893ddf4314e
          path: artifacts/e01/source
          persist-credentials: false
      - name: Install external build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libexpat1-dev zlib1g-dev libbrotli-dev libinih-dev libfmt-dev
      - name: Configure external black-box build with explicit policy
        shell: python
        run: |
          import subprocess, sys
          sys.path.insert(0, 'tools/reference')
          from exiv2_baseline import OPTIONS
          subprocess.run(['cmake', '-S', 'artifacts/e01/source', '-B', 'artifacts/e01/build', '-G', 'Ninja',
                          *[f'-D{k}={v}' for k, v in OPTIONS.items()]], check=True)
      - name: Build only external executable (no upstream tests or fixture imports)
        run: cmake --build artifacts/e01/build --target exiv2 --parallel 2
      - name: Checkout pinned ExifTool secondary reference (never a product dependency)
        uses: actions/checkout@v4
        with:
          repository: ExifTool/exiftool
          ref: 212f02cf22b9484674752181cad3b73089ce9694
          path: artifacts/e01/exiftool
          persist-credentials: false
      - name: Verify the B11 census fixture catalog and byte structure
        run: python tools/reference/b11_container_fixtures.py verify
      - name: B11 container preflight (read-only, vendor-private CIFF never invented)
        run: python tools/reference/probe_b11_raw.py --upstream artifacts/e01/source --build artifacts/e01/build --exiftool-checkout artifacts/e01/exiftool
      - name: B11 census observation batch (pinned CLI and secondary reference, outcomes recorded not gated)
        run: python tools/reference/observe_b11.py --upstream artifacts/e01/source --build artifacts/e01/build --exiftool-checkout artifacts/e01/exiftool
      - name: Upload B11 census observations (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b11-census-observations
          path: artifacts/e01/b11/observations.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload B11 container preflight (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b11-container-preflight
          path: artifacts/e01/b11-container-preflight/observations.json
          if-no-files-found: error
          retention-days: 30
      # The artifact blob host and the Actions log are both unreachable from the environment that
      # recovers this repo's evidence, so a red B11 leg has to explain itself in annotations or it
      # costs a whole extra push to learn anything: the first B11 run failed on a guard that compared
      # the probed-fixture set against all 18 manifest entries, including the blocked cell that has
      # no bytes, and that was only obvious after reading the recorder source. Both recorders
      # save() their report -- with `failure` set to the tail of the traceback -- before re-raising,
      # so this step has something to read even when the process died mid-batch. Annotation budget:
      # the two recorders emit at most 8 each only on failure (a successful run never gets here), so
      # the 30 + 12 chunk caps above still hold for the evidence path.
      - name: Report failed B11 recorder detail
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          import json

          def escape(text):
              return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          for name, path in (('census', 'artifacts/e01/b11/observations.json'),
                             ('preflight', 'artifacts/e01/b11-container-preflight/observations.json')):
              report_path = Path(path)
              if not report_path.exists():
                  print('::error title=B11 %s::no report file: the recorder died before its first '
                        'save()' % name)
                  continue
              report = json.loads(report_path.read_text(encoding='utf-8'))
              summary = ('status=%s observations=%s blocked=%s outcomes=%s' % (
                  report.get('status'), len(report.get('observations', [])),
                  len(report.get('blocked', [])),
                  json.dumps(report.get('outcomeCounts', {}), sort_keys=True)))
              print('::error title=B11 %s summary::%s' % (name, escape(summary)[:1500]))
              trace = escape(report.get('failure') or 'no failure field: the step failed outside the '
                                                     'recorder (see the step name above)')
              chunks = [trace[i:i + 2500] for i in range(0, len(trace), 2500)]
              if len(chunks) > 3:
                  chunks = chunks[:3] + ['traceback truncated: %d characters total' % len(trace)]
              for i, chunk in enumerate(chunks):
                  print('::error title=B11 %s traceback %d/%d::%s' % (name, i + 1, len(chunks), chunk))
  pinned-exiv2-b11l:
    name: Exiv2 0.28.9 / bounded E01 B11L recognition-ladder observations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LC_ALL: C
      TZ: UTC0
      E01_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned external black-box source (never production dependency)
        uses: actions/checkout@v4
        with:
          repository: Exiv2/exiv2
          ref: b0859fc61fea5dedfc898aece6b15893ddf4314e
          path: artifacts/e01/source
          persist-credentials: false
      - name: Install external build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libexpat1-dev zlib1g-dev libbrotli-dev libinih-dev libfmt-dev
      - name: Configure external black-box build with explicit policy
        shell: python
        run: |
          import subprocess, sys
          sys.path.insert(0, 'tools/reference')
          from exiv2_baseline import OPTIONS
          subprocess.run(['cmake', '-S', 'artifacts/e01/source', '-B', 'artifacts/e01/build', '-G', 'Ninja',
                          *[f'-D{k}={v}' for k, v in OPTIONS.items()]], check=True)
      - name: Build only external executable (no upstream tests or fixture imports)
        run: cmake --build artifacts/e01/build --target exiv2 --parallel 2
      # No ExifTool checkout here, unlike B10/B11: this batch compares its own prediction against the pinned
      # build, and a 24-byte header stub is not something a real-world tool can adjudicate. Dropping it also
      # drops the only File*Date-driven nondeterminism, which makes the two runs of this job directly comparable.
      - name: Verify the B11L ladder fixture catalog and its length invariants
        run: python tools/reference/b11l_recognition_ladder.py verify
      - name: B11L recognition-ladder probe (read-only, outcomes recorded not gated)
        run: python tools/reference/probe_b11l_ladder.py --upstream artifacts/e01/source --build artifacts/e01/build
      - name: Upload B11L ladder observations (no executables/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-b11l-ladder-observations
          path: artifacts/e01/b11l-ladder/observations.json
          if-no-files-found: error
          retention-days: 30
      # Same reasoning as the B11 reporter: the artifact host and the Actions log are both unreachable from
      # the environment that recovers this repo's evidence, so a red B11L leg has to explain itself here. The
      # recorder save()s its report -- with `failure` set to the traceback tail -- before re-raising, so a
      # crash mid-ladder still has something to read. The annotation channel is the recovery path for the
      # evidence itself (B11LZ chunks), so this step only re-reports the summary and the failure, not the rows.
      - name: Report failed B11L recorder detail
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          import json

          def escape(text):
              return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          report_path = Path('artifacts/e01/b11l-ladder/observations.json')
          if not report_path.exists():
              print('::error title=B11L ladder::no report file: the recorder died before its first save()')
              raise SystemExit(0)
          report = json.loads(report_path.read_text(encoding='utf-8'))
          summary = ('status=%s rungs=%s rows=%s families=%s flip=%s' % (
              report.get('status'), len(report.get('observations', [])), report.get('recordCount'),
              json.dumps(report.get('familyCounts', {}), sort_keys=True),
              json.dumps({k: v.get('flipSize') for k, v in (report.get('summary') or {}).items()},
                         sort_keys=True)))
          print('::error title=B11L ladder summary::%s' % escape(summary)[:1500])
          trace = escape(report.get('failure') or 'no failure field: the step failed outside the '
                                                  'recorder (see the step name above)')
          chunks = [trace[i:i + 2500] for i in range(0, len(trace), 2500)]
          if len(chunks) > 3:
              chunks = chunks[:3] + ['traceback truncated: %d characters total' % len(trace)]
          for i, chunk in enumerate(chunks):
              print('::error title=B11L ladder traceback %d/%d::%s' % (i + 1, len(chunks), chunk))

  # Differential parity: our readers against the expectations the reference tool itself produced at
  # the pinned commit. Two corpora, one grammar. The upstream test tree is fetched at CI time and
  # read as data - its ``test/data/test_reference_files/*.out`` files are whole-stdout captures of
  # ``exiv2 -Pkycvt <file>``, so the input and its expected print arrive paired and nothing has to be
  # reconstructed. Upstream's *scripts* are deliberately not interpreted: their expectations are class
  # attributes assembled from macro tokens (``commands``/``stdout``/``retval`` with ``$kerCorruptedMetadata``
  # and ``path("$data_path/...")`` substitutions), so honouring them means reimplementing their driver
  # and substitution tables, which is translating their tests - forbidden here. No upstream file is
  # copied, translated, or committed; none of upstream code is built for the first phase, and the
  # report carries only file names, tag keys, our own values and a path@commit pointer.
  #
  # The second corpus is this repository's own generated fixtures, whose oracle is the pinned tool run
  # in the same job: a disagreement there is either a library gap or a change in the pinned output,
  # never a stale committed expectation.
  #
  # Parity numbers never gate a merge. A gap is the unit of work for the next feature PR, and a red
  # build would only bury the measurement of it. A broken *run* does fail: an unreadable dump block, a
  # missing block, a reader that threw instead of refusing, or an expectation file that looks damaged.
  differential-parity:
    name: Exiv2 0.28.9 / differential parity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LC_ALL: C
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DUMP: dotnet run --project tools/MetadataSharp.Dump -c Release -f net10.0 --no-build --
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 8 and 10 SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build the dump tool (restricted to the public API by construction)
        run: dotnet build tools/MetadataSharp.Dump/MetadataSharp.Dump.csproj --configuration Release -f net10.0
      - name: Checkout pinned upstream corpus (CI-time fetch; never vendored, never executed)
        uses: actions/checkout@v4
        with:
          repository: Exiv2/exiv2
          ref: b0859fc61fea5dedfc898aece6b15893ddf4314e
          path: artifacts/parity/exiv2
          persist-credentials: false
      - name: Parity against upstream expectations (no external code configured, built or run)
        shell: bash
        run: |
          python tools/parity/run_parity.py --tree artifacts/parity/exiv2 \
            --dump-command "$DUMP" --out artifacts/parity/upstream --title 'PARITY upstream' --annotate
      - name: Install external build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libexpat1-dev zlib1g-dev libbrotli-dev libinih-dev libfmt-dev
      - name: Configure external black-box build with explicit policy
        shell: python
        run: |
          import subprocess, sys
          sys.path.insert(0, 'tools/reference')
          from exiv2_baseline import OPTIONS
          subprocess.run(['cmake', '-S', 'artifacts/parity/exiv2', '-B', 'artifacts/parity/build', '-G', 'Ninja',
                          *[f'-D{k}={v}' for k, v in OPTIONS.items()]], check=True)
      - name: Build only external executable (no upstream tests or fixture imports)
        run: cmake --build artifacts/parity/build --target exiv2 --parallel 2
      - name: Generate this repository's own fixtures
        shell: bash
        run: |
          mkdir -p artifacts/parity/generated
          dotnet run --project tools/MetadataSharp.ReferenceFixture -c Release -f net10.0 -- generate artifacts/parity/generated
          for name in jpeg png tiff webp xmp; do
            python tools/reference/${name}_owned_fixtures.py generate artifacts/parity/generated
          done
          python tools/reference/dng_fixtures.py generate artifacts/parity/generated
      - name: Parity against owned fixtures (oracle is the pinned tool, run in this same job)
        shell: bash
        run: |
          python tools/parity/run_parity.py \
            --fixtures artifacts/parity/generated --fixtures tests/fixtures/b7 --fixtures tests/fixtures/b8 \
            --fixtures tests/fixtures/b9 --fixtures tests/fixtures/b10 --fixtures tests/fixtures/b11 \
            --fixtures tests/fixtures/b11l \
            --exiv2-command "artifacts/parity/build/bin/exiv2 -Pkycvt" \
            --dump-command "$DUMP" --out artifacts/parity/owned --title 'PARITY owned' --annotate
      - name: Upload parity reports (measurements only - no corpus bytes, no external source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-parity
          path: |
            artifacts/parity/upstream/parity-report.txt
            artifacts/parity/upstream/parity-report.json
            artifacts/parity/owned/parity-report.txt
            artifacts/parity/owned/parity-report.json
          retention-days: 30
